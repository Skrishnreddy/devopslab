# Namespaces the lab owns. Anything labelled devopslab.io/resettable=true can be
# wiped and re-applied by the lab engine without touching the rest of the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: devopslab-system
  labels:
    devopslab.io/managed: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: devopslab-terminal
  labels:
    devopslab.io/managed: "true"
    pod-security.kubernetes.io/enforce: baseline
