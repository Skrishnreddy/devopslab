# 1 control plane + 2 workers => "Nodes: 3 Ready" on the dashboard.
# Workers carry labels so Stage 5 scheduling modules (affinity, taints) have something to target.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudmart
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Ingress reachable from the Mac at http://localhost:8080 and https://localhost:8443
      - containerPort: 80
        hostPort: 8080
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
  - role: worker
    labels:
      devopslab.io/tier: app
  - role: worker
    labels:
      devopslab.io/tier: data
