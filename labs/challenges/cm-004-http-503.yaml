# Example incident definition for the Stage 6 challenge engine (schema draft).
id: cm-004
project: cloudmart
title: Users receive HTTP 503
severity: high
level: advanced
skills: [Pod troubleshooting, Readiness probes, Deployment configuration, Application health checks]
briefing: |
  Users are receiving HTTP 503 errors when accessing CloudMart.
  Identify the root cause and restore the application.
# How the fault is injected into the known-good lab. Applied after a reset.
inject:
  - kind: patch
    target: {kind: Deployment, name: backend, namespace: cloudmart}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /healthz-v2
# Checks the engine runs to decide "resolved". All must pass.
verify:
  - kind: rollout-ready
    target: {kind: Deployment, name: backend, namespace: cloudmart}
  - kind: http
    url: http://localhost:8080/api/health
    expect_status: 200
# Progressive hints: guide, don't hand over the answer.
hints:
  - Check the readiness probe configuration.
  - Compare the configured health-check path with the actual application endpoint.
  - Inspect the application's available HTTP endpoints.
root_cause: Incorrect readiness probe path.
