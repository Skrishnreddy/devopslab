apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  PGHOST: postgres
  PGDATABASE: cloudmart
  PGUSER: cloudmart
  REDIS_HOST: redis
  APP_VERSION: "0.1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      enableServiceLinks: false  # service links would inject REDIS_PORT=tcp://..., clashing with app config
      nodeSelector: {devopslab.io/tier: app}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: devopslab/cloudmart-api:0.1.0
          imagePullPolicy: Never  # built locally by `make images`
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: api-config}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: cloudmart-db, key: password}
          startupProbe:  # first start waits for PostgreSQL (migrations, with retries) before serving
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
