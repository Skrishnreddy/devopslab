# CloudMart: known-good state. The lab engine applies this with `kubectl apply -k`
# and restores it on reset. The database password Secret (cloudmart-db) is
# generated by the engine at deploy time and never stored in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab-cloudmart
labels:
  - pairs:
      app.kubernetes.io/part-of: cloudmart
    includeSelectors: false
resources:
  - namespace.yaml
  - guardrails.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
