      - {id: k8s-17, order: 17, title: Monitoring,              level: advanced,     task: Build dashboards}
      - {id: k8s-18, order: 18, title: GitOps,                  level: advanced,     task: Deploy using Argo CD}
      - {id: k8s-19, order: 19, title: Security,                level: advanced,     task: Scan and secure containers}
      - {id: k8s-20, order: 20, title: Production Support,      level: advanced,     task: Resolve incidents}
