# Learn Mode content. Each module has a level (beginner|intermediate|advanced),
# a practical task, and later (Stage 5) a lab id + checks that verify the task.
tracks:
  - id: kubernetes
    name: Kubernetes
    icon: kubernetes
    status: available
    modules:
      - {id: k8s-01, order: 1,  title: Kubernetes Architecture, level: beginner,     task: Explore the cluster}
