      - {id: k8s-03, order: 3,  title: ReplicaSets,             level: beginner,     task: Maintain replicas}
      - {id: k8s-04, order: 4,  title: Deployments,             level: beginner,     task: Deploy an application}
      - {id: k8s-05, order: 5,  title: Services,                level: beginner,     task: Fix connectivity}
      - {id: k8s-06, order: 6,  title: Ingress,                 level: intermediate, task: Configure routing}
      - {id: k8s-07, order: 7,  title: ConfigMaps,              level: intermediate, task: Change application configuration}
      - {id: k8s-08, order: 8,  title: Secrets,                 level: intermediate, task: Manage credentials}
      - {id: k8s-09, order: 9,  title: Storage,                 level: intermediate, task: Configure PV and PVC}
      - {id: k8s-10, order: 10, title: StatefulSets,            level: intermediate, task: Deploy PostgreSQL}
